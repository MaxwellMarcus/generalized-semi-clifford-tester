[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generalized-semi-clifford-tester"
version = "0.2.0"
description = "Exact computational tools toward testing generalized semi-Clifford structure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maxwell Marcus" }]
keywords = ["quantum-computing", "clifford-hierarchy", "finite-fields"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
qiskit = ["qiskit>=2.2,<3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "qiskit>=2.2,<3", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/MaxwellMarcus/generalized-semi-clifford-tester"
Issues = "https://github.com/MaxwellMarcus/generalized-semi-clifford-tester/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=generalized_semi_clifford --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
